name: PR check

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

# Read-only by default - nothing here writes to the repo. SonarCloud PR
# decoration comes from the SonarCloud GitHub App, not GITHUB_TOKEN write scopes.
permissions:
  contents: read

# A new push to the same PR supersedes the previous run. A push to main gets a group
# of its own: each merge commit needs a green run of its own (a release is tagged from
# one), and a group shared by main's pushes keeps at most one run queued, so three
# merges in two minutes left the middle commit with a cancelled run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, types, tests, e2e (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # The suite plus the browser tests take about four minutes; a hosted job that
    # hangs holds a runner for six hours, once per matrix cell.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Everything the classifiers claim to support.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    permissions:
      contents: read
    # The Redis-backed layers run only against the Redis REDIS_URL names: the job's own.
    env:
      REDIS_URL: redis://localhost:6379
    services:
      redis:
        image: redis:7.4.12-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: matador
    steps:
      - name: Check out matador
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: matador
          fetch-depth: 0          # full history improves Sonar new-code/blame relevancy
          persist-credentials: false

      # matador depends on toro through a local path (../toro), so check it out as a
      # sibling. Paired-branch development: if toro has a branch with the SAME name
      # as this one, use it; otherwise the toro release uv.lock records, since
      # `uv sync --locked` accepts only that version. The script says why.
      - name: Pick the toro ref
        id: toro-ref
        working-directory: matador
        env:
          GH_TOKEN: ${{ github.token }}
          # Through the environment, never interpolated into the script: a branch
          # name is chosen by whoever opens the pull request, and `${{ }}` is
          # substituted into this shell before it runs, so a branch called
          # `x"; curl ... | sh; #` would be executed rather than looked up.
          BRANCH: ${{ github.head_ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OWNER: ${{ github.repository_owner }}
        run: sh .github/scripts/pick-toro-ref.sh

      - name: Check out toro (sibling dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/toro
          ref: ${{ steps.toro-ref.outputs.ref }}
          path: toro
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format (ruff)
        run: uv run ruff format --check .

      - name: Type check (ty)
        run: uv run ty check

      # The workflows are code too, and the rules this repo enforces about them in
      # tests are only the rules somebody thought to write down.
      - name: Audit workflows (zizmor)
        if: matrix.python-version == '3.13'
        run: uv run zizmor --config .github/zizmor.yml .github

      - name: Tests (unit + integration)
        run: uv run pytest -m "unit or integration" --cov=matador --cov-report=xml

      # The committed app.css must match a fresh build of styles/input.css over
      # the current templates - a stale build ships broken styling (e.g. dropped
      # utilities rendering sr-only labels as visible text). Run once per matrix.
      - name: CSS build is fresh
        if: matrix.python-version == '3.13'
        run: |
          curl -sSL -o /tmp/tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
          echo "dc61b3ac6b8c9ca874c0cc4c57b2409791a64c5540404ca5f5367360babc313a  /tmp/tailwindcss" | sha256sum -c -
          chmod +x /tmp/tailwindcss
          /tmp/tailwindcss -i styles/input.css -o matador/static/app.css
          git diff --exit-code matador/static/app.css || {
            echo "::error::matador/static/app.css is stale - rebuild with ./tailwindcss -i styles/input.css -o matador/static/app.css"; exit 1; }

      # Runs only when SONAR_TOKEN is set (skipped on forks / before setup, so the
      # check stays green), and only once per matrix - one coverage upload.
      # Config is inline; projectBaseDir targets the matador checkout because
      # this job uses a sibling layout (matador/ + toro/).
      - name: SonarCloud scan
        if: matrix.python-version == '3.13' && env.SONAR_TOKEN
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: matador
          # coverage.exclusions keeps the browser JS in analysis (issues) but out of the
          # coverage metric - it's exercised by the Playwright e2e suite, not line-instrumented.
          # exclusions drops the two vendored htmx extensions from analysis entirely.
          args: >
            -Dsonar.organization=ilovepixelart
            -Dsonar.projectName=matador
            -Dsonar.projectKey=ilovepixelart_matador
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=matador
            -Dsonar.tests=tests
            -Dsonar.test.exclusions=tests/**
            -Dsonar.coverage.exclusions=tests/**,matador/static/js/**
            -Dsonar.exclusions=matador/static/js/response-targets.js,matador/static/js/loading-states.js,matador/static/app.css

      # Browser behavior doesn't vary by Python - run the e2e layer once.
      - name: Install Playwright browser
        if: matrix.python-version == '3.13'
        run: uv run playwright install --with-deps chromium

      - name: Tests (e2e)
        if: matrix.python-version == '3.13'
        run: uv run pytest -m e2e

  floors:
    # The matrix above runs the newest of everything the lock pins. This job runs the
    # oldest release of each runtime dependency pyproject.toml declares (the lock pins
    # one version, so no other job ever installs the floor).
    name: Tests (dependency floors)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # The Redis-backed layers run only against the Redis REDIS_URL names: the job's own.
    env:
      REDIS_URL: redis://localhost:6379
    services:
      redis:
        image: redis:7.4.12-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: matador
    steps:
      - name: Check out matador
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: matador
          persist-credentials: false

      # `uv sync --locked` needs the sibling the lock was made against; the floor of
      # toro-queue then replaces it from PyPI.
      - name: Pick the toro ref
        id: toro-ref
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OWNER: ${{ github.repository_owner }}
        run: sh .github/scripts/pick-toro-ref.sh

      - name: Check out toro (sibling dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/toro
          ref: ${{ steps.toro-ref.outputs.ref }}
          path: toro
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --locked

      # Keep these equal to the lower bounds in pyproject.toml's dependencies.
      - name: Install the dependency floors
        run: >-
          uv pip install
          "toro-queue==1.1.0"
          "fastapi==0.110.0"
          "uvicorn==0.29.0"
          "jinja2==3.1.0"
          "python-multipart==0.0.9"
          "pygments==2.17.0"

      - name: Tests (unit + integration)
        run: uv run --no-sync pytest -m "unit or integration"

  wheel:
    # The other layers import the source tree beside a toro checkout. This one builds
    # the wheel, installs it into a fresh environment outside the checkout with its
    # dependencies from PyPI, starts the dashboard through the installed `matador`
    # command, and calls every route. It runs on the newest and the oldest toro-queue
    # the wheel accepts, and against the release tests/wheel/allowlist.json names,
    # which must agree except where it says.
    name: Installed wheel (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    permissions:
      contents: read
    # The Redis-backed layers run only against the Redis REDIS_URL names: the job's own.
    env:
      REDIS_URL: redis://localhost:6379
    services:
      redis:
        image: redis:7.4.12-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: matador
    steps:
      - name: Check out matador
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: matador
          persist-credentials: false

      # `uv sync --locked` needs the sibling the lock was made against; the wheel under
      # test does not: its environment takes toro-queue from PyPI.
      - name: Pick the toro ref
        id: toro-ref
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OWNER: ${{ github.repository_owner }}
        run: sh .github/scripts/pick-toro-ref.sh

      - name: Check out toro (sibling dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/toro
          ref: ${{ steps.toro-ref.outputs.ref }}
          path: toro
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --locked

      - name: Installed wheel against the published release
        run: uv run pytest -m wheel

  # The one check the branch rules require: it fails unless every job above
  # succeeded, so adding or renaming a job never needs a ruleset change.
  ci:
    name: CI
    needs: [check, floors, wheel]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if ! printf '%s' "$RESULTS" | jq -e 'all(.[]; . == "success")' > /dev/null; then
            echo "a required job did not succeed" >&2
            exit 1
          fi
