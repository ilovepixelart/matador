name: Feature request
description: Suggest an idea for matador
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is the problem or missing behavior?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: For example, a new view, job action, `create_app` option, or metric.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or existing options you have tried.
